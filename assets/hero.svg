<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Verma — Full-Stack Developer</title>
  <desc id="desc">Ultra-minimal GitHub profile banner with a monochrome base and restrained warm amber accent.</desc>

  <rect width="1200" height="300" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="62" font-size="13" font-weight="700" letter-spacing="4.4" fill="#8c959f">
      FULL-STACK DEVELOPER / <tspan fill="#FFB454">PRODUCT ENGINEERING</tspan>
    </text>

    <text x="62" y="156" font-size="72" font-weight="800" letter-spacing="-2.4" fill="#f0f6fc">Utkarsh Verma</text>

    <text x="64" y="198" font-size="18" font-weight="500" fill="#8c959f">Building polished products, real-time systems, and thoughtful interfaces.</text>
  </g>

  <line x1="64" y1="226" x2="1136" y2="226" stroke="#30363d" stroke-width="1"/>

  <g font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.4" fill="#8c959f">
    <text x="64" y="262">REACT</text>
    <text x="150" y="262">NEXT.JS</text>
    <text x="266" y="262">TYPESCRIPT</text>
    <text x="402" y="262">NODE.JS</text>
    <text x="514" y="262">APIs</text>
    <text x="590" y="262">POSTGRESQL</text>
  </g>

  <g font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="1.6">
    <text x="1136" y="62" text-anchor="end" fill="#6e7681">INDIA · 2026</text>
    <text x="1136" y="262" text-anchor="end" fill="#FFB454">BUILD / LEARN / SHIP</text>
  </g>

  <circle cx="1118" cy="92" r="4" fill="#FFB454">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1106" y="96" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8c959f">OPEN TO SOFTWARE OPPORTUNITIES</text>

  <rect x="64" y="222" width="118" height="2" rx="1" fill="#FFB454">
    <animate attributeName="x" values="64;1018;64" dur="11s" repeatCount="indefinite"/>
  </rect>

  <rect x="548" y="104" width="4" height="58" rx="2" fill="#FFB454">
    <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>

  <rect x="64" y="80" width="42" height="3" rx="1.5" fill="#FFB454"/>
</svg>
