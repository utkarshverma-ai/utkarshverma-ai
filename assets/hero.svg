<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Verma — Full-Stack Developer</title>
  <desc id="desc">Premium beige and maroon GitHub profile banner with restrained editorial typography and subtle motion.</desc>

  <rect width="1200" height="320" rx="22" fill="#F4E9DC"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#D9C5B6" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="60" font-size="12" font-weight="700" letter-spacing="4.2" fill="#8B5E66">FULL-STACK DEVELOPER  /  PRODUCT ENGINEERING</text>

    <text x="68" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#6F1D2F">Utkarsh Verma</text>
    <text x="70" y="193" font-size="18" font-weight="500" fill="#765A55">I build polished web products, real-time experiences, and dependable interfaces.</text>

    <g transform="translate(760 78)">
      <line x1="0" y1="0" x2="0" y2="126" stroke="#CBAEA6"/>
      <text x="28" y="13" font-size="11" font-weight="700" letter-spacing="2.8" fill="#9A7374">FOCUS</text>
      <text x="28" y="48" font-size="22" font-weight="700" fill="#6F1D2F">Product UI</text>
      <text x="28" y="80" font-size="22" font-weight="700" fill="#6F1D2F">Real-time systems</text>
      <text x="28" y="112" font-size="22" font-weight="700" fill="#6F1D2F">Full-stack web</text>
    </g>
  </g>

  <line x1="68" y1="228" x2="1132" y2="228" stroke="#CBAEA6" stroke-width="1.4"/>

  <g font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="1.25" fill="#7E4A55">
    <text x="68" y="264">REACT</text>
    <text x="151" y="264">NEXT.JS</text>
    <text x="268" y="264">TYPESCRIPT</text>
    <text x="404" y="264">NODE.JS</text>
    <text x="516" y="264">REST APIs</text>
    <text x="646" y="264">POSTGRESQL</text>
  </g>

  <g font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="1.35">
    <circle cx="1119" cy="55" r="5" fill="#6F1D2F">
      <animate attributeName="opacity" values="1;0.28;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1104" y="59" text-anchor="end" fill="#8B5E66">OPEN TO SOFTWARE OPPORTUNITIES</text>
    <text x="1132" y="264" text-anchor="end" fill="#6F1D2F">BUILD  /  LEARN  /  SHIP</text>
  </g>

  <rect x="68" y="224" width="122" height="4" rx="2" fill="#6F1D2F">
    <animate attributeName="x" values="68;1010;68" dur="12s" repeatCount="indefinite"/>
  </rect>

  <circle cx="68" cy="292" r="3" fill="#A85A69">
    <animate attributeName="cx" values="68;1132;68" dur="15s" repeatCount="indefinite"/>
  </circle>
</svg>
