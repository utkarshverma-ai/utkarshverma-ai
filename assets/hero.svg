<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Verma — Full-Stack Developer</title>
  <desc id="desc">A restrained editorial GitHub profile banner with Swiss-inspired typography and subtle motion.</desc>

  <rect width="1200" height="340" rx="22" fill="#F5F3EC"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#171717" stroke-width="2"/>

  <rect x="0" y="0" width="14" height="340" rx="7" fill="#2563EB"/>
  <rect x="14" y="0" width="6" height="340" fill="#FF5A36"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#141414">
    <text x="72" y="72" font-size="13" font-weight="700" letter-spacing="4.2">FULL-STACK DEVELOPER / PRODUCT ENGINEERING</text>

    <text x="70" y="164" font-size="74" font-weight="800" letter-spacing="-2">UTKARSH</text>
    <text x="70" y="232" font-size="74" font-weight="800" letter-spacing="-2">VERMA</text>

    <text x="750" y="112" font-size="14" font-weight="700" letter-spacing="2.4">BUILDING</text>
    <text x="750" y="148" font-size="24" font-weight="700">real-time products</text>
    <text x="750" y="181" font-size="24" font-weight="700">clean interfaces</text>
    <text x="750" y="214" font-size="24" font-weight="700">reliable systems</text>
  </g>

  <line x1="70" y1="266" x2="1130" y2="266" stroke="#141414" stroke-width="2"/>

  <g font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#141414">
    <text x="72" y="300">REACT</text>
    <text x="158" y="300">NEXT.JS</text>
    <text x="272" y="300">TYPESCRIPT</text>
    <text x="406" y="300">NODE.JS</text>
    <text x="518" y="300">REST APIs</text>
    <text x="650" y="300">POSTGRESQL</text>
  </g>

  <g font-family="Courier New, monospace" fill="#141414">
    <text x="895" y="300" font-size="12" font-weight="700" letter-spacing="1.5">BUILD / LEARN / SHIP</text>
  </g>

  <circle cx="1115" cy="68" r="7" fill="#FF5A36">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1092" y="74" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#141414" letter-spacing="1.2">AVAILABLE FOR GOOD WORK</text>

  <rect x="70" y="260" width="150" height="4" fill="#2563EB">
    <animate attributeName="width" values="150;255;150" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="72" cy="320" r="3" fill="#2563EB">
    <animate attributeName="cx" values="72;1128;72" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
