<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19352b"><title>सामान की लिस्ट | Shopping Checklist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#22322b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:540px;margin:24px auto;padding:20px}h1{font-size:2rem;margin:0 0 8px}.sub{color:#64736a;margin:0 0 24px}.panel{background:white;border:1px solid #dfdfd5;border-radius:22px;padding:24px;box-shadow:0 14px 40px #1633260b}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:650}.track{height:9px;background:#e9eee9;border-radius:9px;margin:14px 0 24px;overflow:hidden}.fill{height:100%;background:#387b59;width:0%;transition:width .2s}label{display:flex;align-items:center;gap:15px;min-height:55px;padding:10px 5px;border-bottom:1px solid #eee;cursor:pointer;font-size:1.13rem}label:last-child{border-bottom:0}input[type=checkbox]{width:23px;height:23px;accent-color:#30794c;flex:none;cursor:pointer}label:has(input:checked) span{text-decoration:line-through;color:#849089}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}button{border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:600;cursor:pointer;background:#193d2b;color:#fff}.secondary{background:#e9eee9;color:#254834}.note{font-size:.88rem;color:#69766e;margin-top:18px;line-height:1.6}footer{margin-top:24px;color:#78857c;text-align:center;font-size:.82rem}@media(max-width:600px){main{margin:0;padding:19px 14px}.panel{padding:19px}h1{font-size:1.75rem}}
</style></head><body><main><h1>🛒 सामान की लिस्ट</h1><p class="sub">Tap an item when you buy it. Your checks are saved on this device.</p><section class="panel"><div class="stats"><span>Shopping progress</span><span id="count">0 / 12</span></div><div class="track"><div class="fill" id="fill"></div></div><div id="items"></div><div class="actions"><button id="share">📤 Share list</button><button class="secondary" id="reset">↺ Reset</button></div><p class="note">Checks save in this browser only. Sharing this link lets others use their own checklist; it doesn't sync progress between devices.</p></section><footer>Simple shopping checklist</footer></main><script>
const items=["खड़ी मूंग","दीया","किशमिश","रुई की बत्ती","माचिस","बादाम","बिस्कुट","आटा","रागी","मेथी","चूड़ा","मटर"];
const key="shopping-checklist-v1";
let checked;
try{checked=JSON.parse(localStorage.getItem(key)||"[]")}catch{checked=[]}
if(!Array.isArray(checked))checked=[];
function render(){const root=document.getElementById("items");root.replaceChildren();items.forEach((item,i)=>{const label=document.createElement("label"),box=document.createElement("input"),span=document.createElement("span");box.type="checkbox";box.checked=checked.includes(i);span.textContent=item;box.addEventListener("change",()=>{checked=box.checked?[...checked.filter(n=>n!==i),i]:checked.filter(n=>n!==i);save();});label.append(box,span);root.append(label)});document.getElementById("count").textContent=checked.length+" / "+items.length;document.getElementById("fill").style.width=(checked.length/items.length*100)+"%"}
function save(){try{localStorage.setItem(key,JSON.stringify(checked))}catch{}render()}
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Reset all checkboxes?")){checked=[];save()}});
document.getElementById("share").addEventListener("click",async()=>{const text="🛒 सामान की लिस्ट\n\n"+items.map((item,i)=>(checked.includes(i)?"✅ ":"☐ ")+item).join("\n")+"\n\nOpen checklist: "+location.href;if(navigator.share){try{await navigator.share({title:"सामान की लिस्ट",text});return}catch{}}try{await navigator.clipboard.writeText(text);alert("List copied! Paste it into WhatsApp.")}catch{prompt("Copy this shopping list:",text)}});
render();
</script></body></html>
