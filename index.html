<div class="page">
<header class="topline"><div class="brand"><span class="brandmark">✳</span><span class="brandtext" data-t="brand">FAMILY SHOPPING</span></div><nav class="langbar" aria-label="Language / भाषा"><button type="button" class="lang" data-lang="en">English</button><button type="button" class="lang" data-lang="hi">हिन्दी</button><button type="button" class="lang" data-lang="hinglish">Hinglish</button></nav></header>

<section class="hero"><div class="eyebrow" data-t="eyebrow">YOUR SHOPPING COMPANION</div><h1 data-t="heroTitle">मेरी खरीदारी 🛍️</h1><p data-t="heroDescription">छोटी सी लिस्ट, आसान सी शॉपिंग।</p><div class="hero-bottom"><div class="hero-stat"><strong id="heroCount">0</strong> <small id="heroTotal">/ 12</small><span id="heroMessage"></span></div><div class="ring" id="ring" aria-label="Shopping progress"><div class="ring-inner" id="percent">0%</div></div></div></section>
<section class="addcard"><div class="sectiontag" data-t="addTag">ADD TO YOUR LIST</div><h2 class="sectiontitle" data-t="addTitle">नया सामान जोड़ें</h2><form id="quickAdd" class="addline"><label class="sr-only" id="quickLabel" for="quickName">Item name</label><input class="field" id="quickName" name="quickName" autocomplete="off" maxlength="72" required><button class="primary" id="quickAddButton" type="submit">+ जोड़ें</button></form><p class="micro" data-t="addHelp">मात्रा लिखने या बदलने के लिए ✎ दबाएँ।</p></section>
<section class="maincard"><div class="card-head"><div><div class="sectiontag" data-t="listTag">YOUR CHECKLIST</div><h2 data-t="listTitle">सामान की लिस्ट</h2></div><span id="remaining" class="countpill"></span></div><div class="toolbar"><div class="tabs" role="tablist" aria-label="Shopping list filter"><button class="tab" data-filter="all" role="tab" aria-selected="true" type="button"></button><button class="tab" data-filter="pending" role="tab" aria-selected="false" type="button"></button><button class="tab" data-filter="done" role="tab" aria-selected="false" type="button"></button></div><input type="search" id="search" class="field search" autocomplete="off"></div><div id="items" class="items" aria-live="polite"></div><div class="cardactions"><button type="button" id="share" class="primary"></button><button type="button" id="clearDone" class="secondary"></button><button type="button" id="reset" class="soft"></button></div></section>
<footer class="foot"><span data-t="footSave">✓ इस फ़ोन में लिस्ट अपने आप सेव होती है।</span><span data-t="footSync">दूसरे फ़ोन पर लाइव सिंक नहीं होता।</span></footer>
</div>

aro.",shareTitle:"Shopping ki list",boughtLabel:"Le liya",stillNeedLabel:"Lena hai",allBought:"Sab samaan aa gaya.",deleteLabel:"Hatao",editLabel:"Edit",itemPurchased:"Le liya",itemPending:"Lena baaki",shareError:"Share nahi hua. List copy kar lo.",confirmDelete:"Yeh item hata dein?",categoryNames:{grocery:"Kirana",vegetable:"Sabziyaan",puja:"Puja samaan",dryfruit:"Dry fruits",snacks:"Snacks",home:"Ghar ka samaan",other:"Other"},unitNames:{"":"Unit nahi",pcs:"pieces",kg:"kg",g:"gram",l:"litre",ml:"ml",packet:"packet",dozen:"dozen"}}
};
const $=id=>document.getElementById(id);
let {items,language}=readSavedState(localStorage);
let filter="all",search="",editId=null,undoState=null,toastTimer,sharedItems=null;
function t(){return translations[language];}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({items,language}));}catch(_){notify("Storage unavailable; changes may not persist.");}render();}
function notify(message,undoAction=null){const toast=$("toast");$("toastText").textContent=message;undoState=undoAction;$("undo").hidden=!undoAction;$("undo").textContent=t().undo;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove("show");undoState=null;},6000);}
function clearToast(){clearTimeout(toastTimer);$("toast").classList.remove("show");undoState=null;}
function localize(){document.documentElement.lang=language==="hinglish"?"en":language;document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t()[el.dataset.t]||"";});document.querySelectorAll("[data-lang]").forEach(btn=>btn.setAttribute("aria-pressed",String(btn.dataset.lang===language)));$("quickName").placeholder=t().addPlaceholder;$("quickAddButton").textContent=t().addButton;$("quickLabel").textContent=t().nameLabel;$("search").placeholder=t().search;$("search").setAttribute("aria-label",t().search);$("share").textContent=t().share;$("clearDone").textContent=t().clearDone;$("reset").textContent=t().reset;$("cancelEdit").textContent=t().cancel;$("saveEdit").textContent=t().save;["all","pending","done"].forEach(value=>document.querySelector('[data-filter="'+value+'"]').textContent=t()[value]);$("editUnit").replaceChildren();UNITS.forEach(unit=>{const opt=new Option(t().unitNames[unit],unit);$("editUnit").add(opt);});$("editCategory").replaceChildren();CATEGORIES.forEach(cat=>{const opt=new Option(t().categoryNames[cat],cat);$("editCategory").add(opt);});$("importTitle").textContent=t().importTitle;$("importDescription").textContent=t().importDescription;$("acceptImport").textContent=t().importAccept;$("dismissImport").textContent=t().importDismiss;render();}
function quantityLabel(item){if(item.quantity===null)return"";const number=Number(item.quantity).toLocaleString(language==="hi"?"hi-IN":"en-IN");return number+(item.unit?" "+(t().unitNames[item.unit]||item.unit):"");}
function createButton(cls,label,text,callback){const btn=document.createElement("button");btn.type="button";btn.className=cls;btn.setAttribute("aria-label",label);btn.title=label;btn.textContent=text;btn.addEventListener("click",callback);return btn;}
function render(){const progress=getProgress(items);$("heroCount").textContent=progress.done;$("heroTotal").textContent="/ "+progress.total;$("ring").style.setProperty("--pct",progress.percent+"%");$("percent").textContent=progress.percent+"%";$("heroMessage").textContent=progress.total===0?t().ready:progress.remaining===0?t().complete:progress.done===0?t().ready:progress.remaining+" "+t().progress;$("remaining").textContent=progress.remaining+" "+t().remaining;document.querySelectorAll("[data-filter]").forEach(btn=>btn.setAttribute("aria-selected",String(btn.dataset.filter===filter)));$("clearDone").disabled=progress.done===0;$("reset").disabled=progress.done===0;$("quickAddButton").disabled=items.length>=MAX_ITEMS;$("items").replaceChildren();const shown=items.filter(item=>(filter==="all"||filter==="done"&&item.done||filter==="pending"&&!item.done)&&(!search||[item.name,itemName(item,"en"),itemName(item,"hi"),itemName(item,"hinglish"),t().categoryNames[item.category]].some(x=>x.toLocaleLowerCase().includes(search))));if(!shown.length){const empty=document.createElement("div");empty.className="empty";const icon=document.createElement("span");icon.textContent=search?"🔎":"🧺";const title=document.createElement("strong");title.textContent=search?t().noResults:t().empty;const hint=document.createElement("p");hint.textContent=search?t().noResultsHint:t().emptyHint;empty.append(icon,title,hint);$("items").append(empty);return;}shown.forEach(item=>{const row=document.createElement("div");row.className="itemrow"+(item.done?" done":"");const check=createButton("check",itemName(item,language)+", "+(item.done?t().itemPurchased:t().itemPending),"",()=>{item.done=!item.done;persist();if(items.length&&getProgress(items).remaining===0)notify(t().complete);});check.setAttribute("aria-pressed",String(item.done));const tick=document.createElement("span");tick.className="tick";tick.textContent=item.done?"✓":"";const icon=document.createElement("span");icon.className="itemicon";icon.textContent=itemIcon(item);icon.setAttribute("aria-hidden","true");const labels=document.createElement("span");labels.className="itemtext";const name=document.createElement("span");name.className="itemname";name.textContent=itemName(item,language);const meta=document.createElement("span");meta.className="itemmeta";meta.textContent=[quantityLabel(item),t().categoryNames[item.category]].filter(Boolean).join(" · ")+(item.done?" · ✓":"");labels.append(name,meta);check.append(tick,icon,labels);const edit=createButton("edit",t().editLabel+" "+itemName(item,language),"✎",()=>openEditor(item));const remove=createButton("remove",t().deleteLabel+" "+itemName(item,language),"×",()=>removeItem(item.id));row.append(check,edit,remove);$("items").append(row);});}
function removeItem(id){const index=items.findIndex(item=>item.id===id);if(index===-1)return;const previous=items.map(item=>({...item}));items.splice(index,1);persist();notify(t().deleted,()=>{items=previous;persist();});}
function openEditor(item){editId=item.id;$("editorTitle").textContent=t().editTitle;$("editName").value=itemName(item,language);$("editQuantity").value=item.quantity??"";$("editUnit").value=item.unit;$("editCategory").value=item.category;$("formError").textContent="";$("editor").showModal();$("editName").focus();}
function hideImport(){sharedItems=null;$("importBanner").classList.remove("show");if(location.hash.startsWith("#list="))history.replaceState(null,"",location.pathname+location.search);}
function shareText(){const pending=items.filter(x=>!x.done),done=items.filter(x=>x.done);const line=item=>(item.done?"✅ ":"☐ ")+itemName(item,language)+(item.quantity!==null?" — "+quantityLabel(item):"");const link=new URL(location.pathname,location.origin);link.hash="list="+encodeSharedList(items);const msg=["🛒 *"+t().shareTitle+"*","", "📝 *"+t().stillNeedLabel+"*",(pending.length?pending.map(line).join("\n"):t().allBought),"",done.length?"✅ *"+t().boughtLabel+"*\n"+done.map(line).join("\n"):"","", "🔗 "+link.toString()].filter(Boolean).join("\n");return msg;}
function shareViaWhatsApp(){let message;try{message=shareText();}catch(_){notify(t().shareError);return;}const url="https://api.whatsapp.com/send?text="+encodeURIComponent(message);if(url.length<19000){window.open(url,"_blank","noopener,noreferrer");}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(message).then(()=>notify(t().copied)).catch(()=>window.prompt(t().shareTitle,message));}else window.prompt(t().shareTitle,message);}
document.querySelectorAll("[data-lang]").forEach(btn=>btn.addEventListener("click",()=>{language=btn.dataset.lang;if(!LANGUAGES.includes(language))return;persist();localize();}));
document.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{filter=btn.dataset.filter;render();}));
$("quickAdd").addEventListener("submit",event=>{event.preventDefault();if(items.length>=MAX_ITEMS){notify(t().limit);return;}let draft;try{draft=validateItemDraft({name:$("quickName").value,category:"grocery",unit:"",quantity:""});}catch(_){notify(t().invalidName);return;}const dupe=items.find(item=>itemName(item,language).toLocaleLowerCase()===draft.name.toLocaleLowerCase());if(dupe){openEditor(dupe);notify(t().saved);return;}items.push({id:"custom-"+Date.now()+"-"+Math.random().toString(36).slice(2),seed:null,done:false,...draft});$("quickName").value="";search="";$("search").value="";filter="all";persist();notify(t().added);$("quickName").focus();});
$("search").addEventListener("input",event=>{search=event.target.value.trim().toLocaleLowerCase();render();});
$("editForm").addEventListener("submit",event=>{event.preventDefault();const item=items.find(item=>item.id===editId);if(!item)return;let draft;try{draft=validateItemDraft({name:$("editName").value,quantity:$("editQuantity").value,unit:$("editUnit").value,category:$("editCategory").value});}catch(err){$("formError").textContent=err.message==="invalid-quantity"?t().invalidQuantity:t().invalidName;return;}Object.assign(item,draft,{seed:null});$("editor").close();persist();notify(t().saved);});
$("cancelEdit").addEventListener("click",()=>$("editor").close());
$("editor").addEventListener("close",()=>{editId=null;$("formError").textContent="";});
$("undo").addEventListener("click",()=>{const action=undoState;clearToast();if(action)action();});
$("reset").addEventListener("click",()=>{if(!items.some(item=>item.done)){notify(t().emptyReset);return;}if(!confirm(t().resetConfirm))return;const old=items.map(item=>({...item}));items.forEach(item=>item.done=false);filter="all";persist();notify(t().resetDone,()=>{items=old;persist();});});
$("clearDone").addEventListener("click",()=>{if(!items.some(item=>item.done)){notify(t().emptyPurchased);return;}if(!confirm(t().clearConfirm))return;const old=items.map(item=>({...item}));items=items.filter(item=>!item.done);filter="all";persist();notify(t().clearDoneMessage,()=>{items=old;persist();});});
$("share").addEventListener("click",shareViaWhatsApp);
$("dismissImport").addEventListener("click",hideImport);
$("acceptImport").addEventListener("click",()=>{if(!sharedItems)return;items=sharedItems;filter="all";search="";$("search").value="";persist();hideImport();notify(t().imported);});
function checkImport(){if(!location.hash.startsWith("#list="))return;try{sharedItems=decodeSharedList(location.hash.slice(6));$("importBanner").classList.add("show");}catch(_){hideImport();notify(t().invalidLink);}}
window.addEventListener("hashchange",checkImport);
localize();checkImport();
</script>
